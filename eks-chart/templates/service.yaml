apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apiService }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=Namespace is provided by the Argo CD Application destination (my-app)
spec:
  selector:
    app: {{ .Values.appName }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: http-server
      name: http-service
    - protocol: TCP
      port: 90
      targetPort: grpc-server
      name: grpc-service
  type: ClusterIP