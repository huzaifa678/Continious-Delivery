{{- if and (eq .Values.environment "test") .Values.ingress.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apiService }}
spec:
  selector:
    app: {{ .Values.appName }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: http-server
      name: http-service
    - protocol: TCP
      port: 90
      targetPort: grpc-server
      name: grpc-service
  type: ClusterIP
{{- end }}
---
{{- if and .Values.gateway.enabled (eq .Values.environment "post-test") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apiService }}
  namespace: {{ .Values.namespace }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.domainName.http }}, {{ .Values.domainName.grpc }}
spec:
  selector:
    app: {{ .Values.appName }}
  ports:
    - name: http-service
      protocol: TCP
      port: 80
      targetPort: http-server
    - name: grpc-service
      protocol: TCP
      port: 90
      targetPort: grpc-server
  type: LoadBalancer
{{- end }}