{{- if and .Values.gateway.enabled (eq .Values.environment "test") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apiService }}
spec:
  selector:
    app: {{ .Values.appName }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: http-server
      name: http-service
    - protocol: TCP
      port: 90
      targetPort: grpc-server
      name: grpc-service
  type: ClusterIP
{{- end }}
---
{{- if and .Values.gateway.enabled (eq .Values.environment "post-test") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apiService }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  selector:
    app: {{ .Values.appName }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: http-server
      name: http-service
    - protocol: TCP
      port: 90
      targetPort: grpc-server
      name: grpc-service
    - name: https-service
      port: 443
      targetPort: http-server
      protocol: TCP
  type: LoadBalancer
{{- end }}