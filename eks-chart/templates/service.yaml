{{- if and .Values.gateway.enabled (eq .Values.environment "post") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apiService }}
spec:
  selector:
    app: {{ .Values.appName }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: http-server
      name: http-service
    - protocol: TCP
      port: 90
      targetPort: grpc-server
      name: grpc-service
  type: ClusterIP
{{- end }}
---
{{- if and .Values.gateway.enabled (eq .Values.environment "post-test") (gt (len .Values.gateway.publicSubnetIds) 0) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apiService }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-subnets: {{ join "," .Values.gateway.publicSubnetIds }}
    networking.aws.amazon.com/ip-address-type: dualstack
    networking.aws.amazon.com/subnets: {{ join "," .Values.gateway.publicSubnetIds }}
    external-dns.alpha.kubernetes.io/target: {{ .Values.gateway.nlbTarget | default "" }}
spec:
  selector:
    app: {{ .Values.appName }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: http-server
      name: http-service
    - protocol: TCP
      port: 90
      targetPort: grpc-server
      name: grpc-service
  type: LoadBalancer
{{ -end }}