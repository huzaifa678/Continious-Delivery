{{- if and (eq .Values.environment "test") .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.appName }}-ingress-http
  namespace: {{ .Values.namespace }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "{{ .Values.domainName.http }}"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  rules:
    - host: {{ .Values.domainName.http }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.apiService }}
                port:
                  number: {{ .Values.httpPort }}
  tls:
    - hosts:
        - {{ .Values.domainName.http }}
      secretName: {{ .Values.tlsSecretName.http }}

        secretName: {{ .Values.tlsSecretName.grpc }}
{{- end }}