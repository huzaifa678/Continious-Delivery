{{- if and .Values.gateway.enabled (eq .Values.environment "post-test") (gt (len .Values.gateway.publicSubnetIds) 0) }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.appName }}-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: {{ .Values.gatewayClass }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.domainName.http }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.domainName.http }}
      tls:
        certificateRefs:
          - name: {{ .Values.tlsSecretName.http }}
    - name: grpc
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.domainName.grpc }}
      tls:
        certificateRefs:
          - name: {{ .Values.tlsSecretName.grpc }}
{{- end }}
