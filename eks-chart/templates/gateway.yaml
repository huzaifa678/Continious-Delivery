apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Values.appName }}-gateway
  namespace: default
spec:
  gatewayClassName: {{ .Values.gatewayClass }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.domainName.http }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.domainName.http }}
      tls:
        certificateRefs:
          - name: {{ .Values.tlsSecretName.http }}
    - name: grpc
      protocol: GRPC
      port: 443
      hostname: {{ .Values.domainName.grpc }}
      tls:
        certificateRefs:
          - name: {{ .Values.tlsSecretName.grpc }}
