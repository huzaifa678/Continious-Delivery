apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.appName }}-netpol
  labels:
    app: {{ .Values.appName }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.appName }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic to the HTTP and gRPC ports (e.g. from the ingress/gateway).
    - ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 9090
  egress:
    # Allow DNS resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to backing services (RDS 5432, Redis 6379) and HTTPS.
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 443
