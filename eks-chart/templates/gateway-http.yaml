{{- if and (eq .Values.environment "post-test") .Values.ingress.enabled }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ .Values.appName }}-http-route
  namespace: default
spec:
  parentRefs:
    - name: {{ .Values.appName }}-gateway
  hostnames:
    - {{ .Values.domainName.http }}
  rules:
    - matches:
        - path:
            type: Prefix
            value: /
      backendRefs:
        - name: {{ .Values.apiService }}
          port: 80
{{- end }}