{{- if and .Values.gateway.enabled (eq .Values.environment "post-test") }}
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: nginx-gateway
  ports:
    - name: https
      port: 443
      targetPort: 443
    - name: http
      port: 80
      targetPort: 80
{{- end }}