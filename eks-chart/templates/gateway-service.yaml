{{- if and .Values.gateway.enabled (eq .Values.environment "post-test") }}
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-lb
  namespace: {{ .Values.namespace }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    gateway.networking.k8s.io/gateway-name: {{ .Values.appName }}-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
{{- end }}