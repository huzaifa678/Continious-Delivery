apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/huzaifa678/Continious-Delivery.git
    targetRevision: main
    path: eks-chart/crds   
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false        
      selfHeal: false