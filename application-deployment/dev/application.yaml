apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypto-app
  namespace: argocd
  annotations:
    # Forces Argo CD to fully re-evaluate live state vs Git
    argocd.argoproj.io/refresh: hard
spec:
  project: default

  source:
    repoURL: https://github.com/huzaifa678/Continious-Delivery.git
    targetRevision: main
    path: eks-chart
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: environment
          value: post-test

  destination:
    server: https://kubernetes.default.svc
    namespace: my-app

  syncPolicy:
    automated:
      prune: true       
      selfHeal: true     
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true               
      - ApplyOutOfSyncOnly=true       
      - FailOnSharedResource=true     

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP